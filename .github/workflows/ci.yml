name: CI

# Build and test on every push to a branch that versions (main, develop, preview/*, release/*), every pull request and
# by hand, on Windows and Linux (plan T of the Fuxion workspace). Each runs the tests it can: .NET Framework (net472)
# runs only on Windows, so off it the test projects leave it out (the workspace's test.targets); the tests that start
# a Linux container are marked Needs=Docker, and Windows leaves them out. Windows also packs: every framework is native
# there. A push then waits for the approval of the user (the environment 'nuget' has the user as its required
# reviewer): approved, the packages go to nuget.org with the version of the commit; rejected, or never approved,
# nothing goes out. A push that only changes what does not reach the build (documentation, the files of the coding
# agents, the bookkeeping of fx sync in _fx/.inherited/inherited.yaml) runs nothing (idea I-45).
#
# nuget.org: Trusted Publishing, no stored key. A policy of the owner OsJimenez trusts this workflow file (ci.yml) of
# osjimenez/Fuxion in the environment 'nuget'; NuGet/login exchanges the OIDC token of the job for a key of one hour.

on:
  push:
    branches: [main, develop, 'preview/**', 'release/**']
    paths:
      - '**'
      - '!**/*.md'
      - '**/PACKAGE_README.md'
      - '!.claude/**'
      - '!.agents/**'
      - '!_fx/harness/**'
      - '!_fx/.inherited/harness/**'
      - '!_fx/.inherited/inherited.yaml'
  pull_request:
    paths:
      - '**'
      - '!**/*.md'
      - '**/PACKAGE_README.md'
      - '!.claude/**'
      - '!.agents/**'
      - '!_fx/harness/**'
      - '!_fx/.inherited/harness/**'
      - '!_fx/.inherited/inherited.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # a pull request: only its last push; a push: each runs, with its own approval (a run waiting for one must not hold
  # the next ones)
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || format('ci-{0}', github.run_id) }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            tests: --filter-not-trait "Needs=Docker"
            pack: true
          - os: ubuntu-latest
            tests: ''
    runs-on: ${{ matrix.os }}
    # a step that hangs does not hold the runner for the six hours GitHub allows by default
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # the version comes from the tags and the commits since (fx version)
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          # the SDK 11 builds (the one of the workspace); the runtime 10 runs the net10.0 tests
          dotnet-version: |
            10.0.x
            11.0.100-rc.2.26504.105

      - name: Build
        run: dotnet build Fuxion.slnx -c Release

      # the tests this system can run; every wait of the tests has its limit, and this one is for all of them. A runner
      # left with no test to run (all need what it lacks) is not a failure (exit code 8)
      - name: Test
        run: dotnet test --solution Fuxion.slnx -c Release --no-build --timeout 25m --ignore-exit-code 8 ${{ matrix.tests }}

      - name: Pack
        if: matrix.pack
        run: dotnet pack Fuxion.slnx -c Release --no-build -p:PackageOutputPath=${{ github.workspace }}/artifacts/nupkgs/

      # the version that would go out, seen before approving: a notice at the top of the run, and the packages in its
      # summary (a tag not pushed gives another version: version/X.Y.0 is on GitHub, or this is not the one expected)
      - name: Version
        if: matrix.pack
        shell: pwsh
        run: |
          $packages = Get-ChildItem artifacts/nupkgs -Filter *.nupkg | Sort-Object Name
          if ($packages[0].BaseName -notmatch '^.+?\.(?<version>\d+\.\d+\.\d+(-.+)?)$') { throw "No version in $($packages[0].Name)" }
          $version = $Matches.version
          Write-Output "::notice title=Version::$version"
          @("### Version $version", '') + ($packages | ForEach-Object { "- ``$($_.BaseName)``" }) |
            Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v7
        if: matrix.pack
        with:
          name: packages
          path: artifacts/nupkgs/
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: nuget
    # once approved (the wait for the approval does not count)
    timeout-minutes: 30
    permissions:
      id-token: write      # the OIDC token for nuget.org (Trusted Publishing)
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: artifacts/nupkgs

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: NuGet login (OIDC, temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: OsJimenez   # the profile name on nuget.org, not an email

      # each package with its .snupkg; a version already there (a run again) is not an error
      - name: Push to nuget.org
        env:
          API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          ls -l artifacts/nupkgs
          for package in artifacts/nupkgs/*.nupkg; do
            dotnet nuget push "$package" --api-key "$API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
